apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kite
  namespace: kube-system
  labels:
    app.kubernetes.io/instance: kite
spec:
  ingressClassName: nginx
  # Reachable as both kite.halo.fabseit.net and kite.fabseit.net. The
  # anchor keeps a single backend definition for the two hosts.
  rules:
    - host: kite.halo.fabseit.net
      http: &http
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kite
                port:
                  number: 8080
    - host: kite.fabseit.net
      http: *http
  tls:
    - hosts:
        - kite.halo.fabseit.net
        - kite.fabseit.net
      secretName: kite-fabseit-net-prod-tls
