          },
          "description": "Mechanical wear of spinning disks. Load_Cycle_Count = head parks (laptop drives like the WD10JMVW are typically rated for ~300k-600k), Start_Stop_Count = spin-ups. halo-8's WD HDD is only read within 10 min of real disk I/O (so it can spin down), i.e. around backups; in between it shows the last reading, and after an exporter restart it is missing until its next activity.",
