# S.M.A.R.T. disk health dashboard, picked up by the Grafana sidecar
# (label grafana_dashboard=1, watched in all namespaces). Data comes from the
# smartctl-exporter DaemonSet (smartctl-exporter.yaml in this directory).
# To change it, edit a copy in Grafana, export the JSON and paste it back here
# (provisioned dashboards cannot be saved from the UI).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-smart
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  smart-disks.json: |
    {
      "uid": "smart-disks",
      "title": "Disks / S.M.A.R.T.",
      "tags": [
        "smart",
        "storage",
        "hardware"
      ],
      "refresh": "5m",
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "timezone": "browser",
      "schemaVersion": 39,
      "graphTooltip": 1,
      "editable": true,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0
          },
          {
            "name": "node",
            "label": "Node",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(smartctl_device, instance)",
              "refId": "node"
            },
            "definition": "label_values(smartctl_device, instance)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "sort": 1,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            }
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "type": "row",
          "title": "Overview",
          "id": 1,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Disks monitored",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Physical disks reporting SMART data. NVMe on halo-0/1/2, USB SSD + USB HDD on halo-8 (SD cards have no SMART). halo-8's WD HDD is only read within 10 min of real disk I/O (so it can spin down), i.e. around backups; in between it shows the last reading, and after an exporter restart it is missing until its next activity.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(smartctl_device{instance=~\"$node\"})",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "title": "SMART health failing",
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Disks whose overall SMART self-assessment is FAILED. Replace and restore from backup.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(smartctl_device_smart_status{instance=~\"$node\"} == 0) or vector(0)",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "title": "Critical warnings",
          "id": 4,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "NVMe disks with a critical warning bit set, or available spare at/below its threshold.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(count(smartctl_device_critical_warning{instance=~\"$node\"} > 0) or vector(0)) + (count(smartctl_device_available_spare{instance=~\"$node\"} <= on (instance, device) smartctl_device_available_spare_threshold{instance=~\"$node\"}) or vector(0))",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "title": "Disks with media errors",
          "id": 5,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Disks with any reallocated/pending/uncorrectable sectors, failed program/erase blocks (ATA) or media errors (NVMe). Not necessarily fatal, but watch the trend in the error table.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count((sum by (instance, device) (smartctl_device_attribute{instance=~\"$node\", attribute_value_type=\"raw\", attribute_name=~\"Reallocated_Sector_Ct|Reallocated_Event_Count|Current_Pending_Sector|Offline_Uncorrectable|Reported_Uncorrect|Uncorrectable_Error_Cnt|Runtime_Bad_Block|Program_Fail_Cnt_Total|Erase_Fail_Count_Total|Used_Rsvd_Blk_Cnt_Tot|Spin_Retry_Count|End-to-End_Error\"}) or max by (instance, device) (smartctl_device_media_errors{instance=~\"$node\"})) > 0) or vector(0)",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "title": "Hottest disk",
          "id": 6,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Highest current drive temperature. NVMe throttle limit here is 90 °C, HDDs prefer < 45 °C.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(max by (instance, device) (smartctl_device_temperature{instance=~\"$node\", temperature_type=\"current\"}))",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 50
                  },
                  {
                    "color": "red",
                    "value": 60
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "stat",
          "title": "Highest wear",
          "id": 7,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Most worn SSD: NVMe 'Percentage Used', SATA SSD 100 − normalized wear-leveling value. 100 % = rated endurance reached (the drive usually keeps working, but plan a replacement).",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(max by (instance, device) (smartctl_device_percentage_used{instance=~\"$node\"}) or max by (instance, device) (100 - smartctl_device_attribute{instance=~\"$node\", attribute_value_type=\"value\", attribute_name=~\"Wear_Leveling_Count|Media_Wearout_Indicator|SSD_Life_Left|Percent_Lifetime_Remain\"}))",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "type": "row",
          "title": "Disks",
          "id": 8,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "panels": []
        },
        {
          "type": "table",
          "title": "Disks",
          "id": 9,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "One row per physical disk. Errors = sum of reallocated/pending/uncorrectable sector counters (ATA) or media errors (NVMe). halo-8's WD HDD is only read within 10 min of real disk I/O (so it can spin down), i.e. around backups; in between it shows the last reading, and after an exporter restart it is missing until its next activity.",
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (instance, device, model_name, interface, serial_number, firmware_version) (smartctl_device{instance=~\"$node\"})",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (instance, device) (smartctl_device_smart_status{instance=~\"$node\"})",
              "legendFormat": "",
              "refId": "B",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (instance, device) (smartctl_device_temperature{instance=~\"$node\", temperature_type=\"current\"})",
              "legendFormat": "",
              "refId": "C",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (instance, device) (smartctl_device_percentage_used{instance=~\"$node\"}) or max by (instance, device) (100 - smartctl_device_attribute{instance=~\"$node\", attribute_value_type=\"value\", attribute_name=~\"Wear_Leveling_Count|Media_Wearout_Indicator|SSD_Life_Left|Percent_Lifetime_Remain\"})",
              "legendFormat": "",
              "refId": "D",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (instance, device) (smartctl_device_power_on_seconds{instance=~\"$node\"})",
              "legendFormat": "",
              "refId": "E",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (instance, device) (smartctl_device_power_cycle_count{instance=~\"$node\"})",
              "legendFormat": "",
              "refId": "F",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (instance, device) (smartctl_device_bytes_written{instance=~\"$node\"}) or max by (instance, device) (smartctl_device_attribute{instance=~\"$node\", attribute_value_type=\"raw\", attribute_name=\"Total_LBAs_Written\"}) * 512",
              "legendFormat": "",
              "refId": "G",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (instance, device) (smartctl_device_capacity_bytes{instance=~\"$node\"})",
              "legendFormat": "",
              "refId": "H",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (instance, device) (smartctl_device_attribute{instance=~\"$node\", attribute_value_type=\"raw\", attribute_name=~\"Reallocated_Sector_Ct|Reallocated_Event_Count|Current_Pending_Sector|Offline_Uncorrectable|Reported_Uncorrect|Uncorrectable_Error_Cnt|Runtime_Bad_Block|Program_Fail_Cnt_Total|Erase_Fail_Count_Total|Used_Rsvd_Blk_Cnt_Tot|Spin_Retry_Count|End-to-End_Error\"}) or max by (instance, device) (smartctl_device_media_errors{instance=~\"$node\"})",
              "legendFormat": "",
              "refId": "I",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value #A": true
                },
                "indexByName": {
                  "instance": 0,
                  "device": 1,
                  "model_name": 2,
                  "interface": 3,
                  "Value #B": 4,
                  "Value #C": 5,
                  "Value #D": 6,
                  "Value #I": 7,
                  "Value #E": 8,
                  "Value #F": 9,
                  "Value #G": 10,
                  "Value #H": 11,
                  "serial_number": 12,
                  "firmware_version": 13
                },
                "renameByName": {
                  "instance": "Node",
                  "device": "Device",
                  "model_name": "Model",
                  "interface": "Interface",
                  "Value #B": "Health",
                  "Value #C": "Temp",
                  "Value #D": "Wear",
                  "Value #I": "Errors",
                  "Value #E": "Power-on time",
                  "Value #F": "Power cycles",
                  "Value #G": "Written",
                  "Value #H": "Capacity",
                  "serial_number": "Serial",
                  "firmware_version": "Firmware"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Health"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "1": {
                            "text": "PASSED",
                            "color": "green",
                            "index": 0
                          },
                          "0": {
                            "text": "FAILED",
                            "color": "red",
                            "index": 1
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Temp"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "celsius"
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "yellow",
                          "value": 50
                        },
                        {
                          "color": "red",
                          "value": 60
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Wear"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percent"
                  },
                  {
                    "id": "min",
                    "value": 0
                  },
                  {
                    "id": "max",
                    "value": 100
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "gauge",
                      "mode": "basic",
                      "valueDisplayMode": "text"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "yellow",
                          "value": 70
                        },
                        {
                          "color": "red",
                          "value": 90
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Errors"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 1
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Power-on time"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 1
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Written"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "decbytes"
                  },
                  {
                    "id": "decimals",
                    "value": 1
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Capacity"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "decbytes"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "sortBy": [
              {
                "displayName": "Node",
                "desc": false
              }
            ]
          }
        },
        {
          "type": "row",
          "title": "Temperature & wear",
          "id": 10,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 13
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Temperature",
          "id": 11,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Current drive temperature per disk. Dashed lines: 50 °C / 60 °C. halo-8's WD HDD is only read within 10 min of real disk I/O (so it can spin down), i.e. around backups; in between it shows the last reading, and after an exporter restart it is missing until its next activity.",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 14
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(max by (instance, device) (smartctl_device_temperature{instance=~\"$node\", temperature_type=\"current\"})) * on (instance, device) group_left (model_name) max by (instance, device, model_name) (smartctl_device{instance=~\"$node\"})",
              "legendFormat": "{{instance}} · {{model_name}}",
              "refId": "A",
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "min": null,
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "dashed"
                }
              },
              "thresholds": {
                "mode": "absolute",
