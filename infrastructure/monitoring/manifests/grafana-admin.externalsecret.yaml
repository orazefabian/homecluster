# Source of truth: Vaultwarden item "monitoring/monitoring-grafana-admin"
# (collection homecluster). Referenced by values.yaml (grafana.admin.existingSecret).
#
# Grafana keeps the admin password in its database on the PVC and only reads
# GF_SECURITY_ADMIN_PASSWORD when that database is first created. After changing
# the password in Vaultwarden, apply it once (also noted in the item):
#   kubectl -n monitoring exec deploy/monitoring-helm-grafana -c grafana -- \
#     grafana cli admin reset-admin-password --password-from-stdin \
#     < <(kubectl -n monitoring get secret monitoring-grafana-admin -o jsonpath='{.data.admin-password}' | base64 -d)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: monitoring-grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: monitoring-grafana-admin
    # Creates the Secret if missing, never deletes it, keeps keys it does not manage.
    creationPolicy: CreateOrMerge
    # Set explicitly so ESO does not copy this ExternalSecret's labels onto the
    # Secret: it would inherit ArgoCD's app.kubernetes.io/instance tracking
    # label, and ArgoCD (prune on) would then delete the Secret on next sync.
    template:
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: admin-user
      remoteRef:
        key: ee738239-8bc8-4005-aa39-1f117b76517b
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: ee738239-8bc8-4005-aa39-1f117b76517b
        property: admin-password
