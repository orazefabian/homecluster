# Source of truth: Vaultwarden item "monitoring/alertmanager-notifications"
# (collection homecluster), custom fields:
#   discord-webhook-url  Discord channel webhook (Channel settings -> Integrations)
#   healthchecks-url     healthchecks.io ping URL of the dead-man's-switch check
#                        (period 5 min, grace 15 min)
# Referenced by the AlertmanagerConfig in alertmanager-config.yaml; the
# operator inlines both URLs into the generated (Secret-stored) Alertmanager
# config. A rotated URL lands after ESO refresh (<=1h) + operator reconcile.
# If this Secret is missing, the operator keeps the previous config (no outage).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-notifications
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: alertmanager-notifications
    # Creates the Secret if missing, never deletes it, keeps keys it does not manage.
    creationPolicy: CreateOrMerge
    # Set explicitly so ESO does not copy this ExternalSecret's labels onto the
    # Secret: it would inherit ArgoCD's app.kubernetes.io/instance tracking
    # label, and ArgoCD (prune on) would then delete the Secret on next sync.
    template:
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: discord-webhook-url
      remoteRef:
        key: 8d23dc0c-ba09-4f8d-914e-3bde72b32ab6
        property: discord-webhook-url
    - secretKey: healthchecks-url
      remoteRef:
        key: 8d23dc0c-ba09-4f8d-914e-3bde72b32ab6
        property: healthchecks-url
