# Node health dashboard ("Nodes / Health"), picked up by the Grafana sidecar
# (label grafana_dashboard=1, watched in all namespaces). Data comes from
# node-exporter (kube-prometheus-stack) and kube-state-metrics: SoC / NVMe /
# RP1 temperatures, fan, Raspberry Pi undervoltage flag, uptime and reboots,
# CPU clock, CPU / memory / PSI, filesystems, physical-disk I/O, eth0, NTP.
# Node-exporter labels series by IP:port, so queries join node_uname_info to
# show the hostname. The hidden $instance variable maps $node to those IPs.
# To change it, edit a copy in Grafana, export the JSON and paste it back here
# (provisioned dashboards cannot be saved from the UI).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-node-health
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  node-health.json: |
    {
      "uid": "node-health",
      "title": "Nodes / Health",
      "tags": [
        "nodes",
        "hardware",
        "raspberry-pi"
      ],
      "description": "Health of the halo Raspberry Pi nodes: temperatures, cooling, power, uptime, resources.",
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timezone": "browser",
      "schemaVersion": 39,
      "graphTooltip": 1,
      "editable": true,
      "links": [
        {
          "title": "Disks / S.M.A.R.T.",
          "type": "link",
          "url": "/d/smart-disks",
          "icon": "dashboard",
          "targetBlank": false
        }
      ],
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          },
          {
            "name": "Reboots",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "enable": true,
            "iconColor": "orange",
            "expr": "max by (nodename) (changes(node_boot_time_seconds{instance=~\"$instance\"}[2m]) * on(instance) group_left(nodename) node_uname_info{instance=~\"$instance\"}) > 0",
            "step": "60s",
            "titleFormat": "Reboot",
            "textFormat": "{{nodename}} rebooted"
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0
          },
          {
            "name": "node",
            "label": "Node",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(node_uname_info, nodename)",
              "refId": "node"
            },
            "definition": "label_values(node_uname_info, nodename)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "sort": 1,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            }
          },
          {
            "name": "instance",
            "label": "Instance",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "hide": 2,
            "query": {
              "query": "label_values(node_uname_info{nodename=~\"$node\"}, instance)",
              "refId": "instance"
            },
            "definition": "label_values(node_uname_info{nodename=~\"$node\"}, instance)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "sort": 1,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            }
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "id": 1,
          "title": "Overview",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "id": 2,
          "title": "Nodes ready",
          "description": "Kubernetes nodes reporting Ready / total nodes.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"}) or vector(0)",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 4
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "wideLayout": true
          }
        },
        {
          "type": "stat",
          "id": 3,
          "title": "Hottest CPU",
          "description": "Highest SoC temperature right now. Pi 5 firmware starts soft-throttling at 80 °C, hard limit 85 °C.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(node_hwmon_temp_celsius{chip=\"thermal_thermal_zone0\",sensor=\"temp0\",instance=~\"$instance\"})",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 70
                  },
                  {
                    "color": "orange",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "wideLayout": true
          }
        },
        {
          "type": "stat",
          "id": 4,
          "title": "Undervoltage (range)",
          "description": "Nodes on which the Raspberry Pi firmware raised the undervoltage alarm (rpi_volt in0 lcrit) at any time in the selected range. Anything above 0 means a weak PSU or cable.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(max_over_time(node_hwmon_in_lcrit_alarm_volts{chip=\"soc:firmware_raspberrypi_hwmon\",instance=~\"$instance\"}[$__range]) > 0) or vector(0)",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "wideLayout": true
          }
        },
        {
          "type": "stat",
          "id": 5,
          "title": "Reboots (range)",
          "description": "Node reboots in the selected range (changes of node_boot_time_seconds).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(changes(node_boot_time_seconds{instance=~\"$instance\"}[$__range])) or vector(0)",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "wideLayout": true
          }
        },
        {
          "type": "stat",
          "id": 6,
          "title": "OOM kills (range)",
          "description": "Kernel OOM-killer invocations across selected nodes in the selected range.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(increase(node_vmstat_oom_kill{instance=~\"$instance\"}[$__range])) or vector(0)",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "wideLayout": true
          }
        },
        {
          "type": "stat",
          "id": 7,
          "title": "Clock in sync",
          "description": "Nodes whose kernel clock is NTP-synchronised / selected nodes. Unsynced clocks break TLS, Longhorn and log ordering.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(node_timex_sync_status{instance=~\"$instance\"}) / count(node_timex_sync_status{instance=~\"$instance\"})",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "wideLayout": true
          }
        },
        {
          "type": "table",
          "id": 8,
          "title": "Node status",
          "description": "One row per node. Temperatures: Pi 5 soft-throttles at 80 °C. Load is the 5-minute load average divided by the core count (1.0 = fully busy). Undervoltage / OOM kills cover the selected time range.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 6,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (nodename) (label_replace(kube_node_status_condition{condition=\"Ready\",status=\"true\"}, \"nodename\", \"$1\", \"node\", \"(.*)\"))",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (nodename) ((time() - node_boot_time_seconds{instance=~\"$instance\"}) * on(instance) group_left(nodename) node_uname_info{instance=~\"$instance\"})",
              "legendFormat": "",
              "refId": "B",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (nodename) (node_hwmon_temp_celsius{chip=\"thermal_thermal_zone0\",sensor=\"temp0\",instance=~\"$instance\"} * on(instance) group_left(nodename) node_uname_info{instance=~\"$instance\"})",
              "legendFormat": "",
              "refId": "C",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (nodename) ((1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\",instance=~\"$instance\"}[5m]))) * on(instance) group_left(nodename) node_uname_info{instance=~\"$instance\"})",
              "legendFormat": "",
              "refId": "D",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (nodename) ((node_load5{instance=~\"$instance\"} / on(instance) count by (instance) (node_cpu_seconds_total{mode=\"idle\",instance=~\"$instance\"})) * on(instance) group_left(nodename) node_uname_info{instance=~\"$instance\"})",
              "legendFormat": "",
              "refId": "E",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (nodename) ((1 - node_memory_MemAvailable_bytes{instance=~\"$instance\"} / node_memory_MemTotal_bytes{instance=~\"$instance\"}) * on(instance) group_left(nodename) node_uname_info{instance=~\"$instance\"})",
              "legendFormat": "",
              "refId": "F",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (nodename) ((1 - node_filesystem_avail_bytes{mountpoint=\"/\",instance=~\"$instance\"} / node_filesystem_size_bytes{mountpoint=\"/\",instance=~\"$instance\"}) * on(instance) group_left(nodename) node_uname_info{instance=~\"$instance\"})",
              "legendFormat": "",
              "refId": "G",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (nodename) (node_hwmon_fan_rpm{instance=~\"$instance\"} * on(instance) group_left(nodename) node_uname_info{instance=~\"$instance\"})",
              "legendFormat": "",
              "refId": "H",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (nodename) (max_over_time(node_hwmon_in_lcrit_alarm_volts{chip=\"soc:firmware_raspberrypi_hwmon\",instance=~\"$instance\"}[$__range]) * on(instance) group_left(nodename) node_uname_info{instance=~\"$instance\"})",
              "legendFormat": "",
              "refId": "I",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (nodename) (increase(node_vmstat_oom_kill{instance=~\"$instance\"}[$__range]) * on(instance) group_left(nodename) node_uname_info{instance=~\"$instance\"})",
              "legendFormat": "",
              "refId": "J",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {
                  "nodename": 0,
                  "Value #A": 1,
                  "Value #B": 2,
                  "Value #C": 3,
                  "Value #D": 4,
                  "Value #E": 5,
                  "Value #F": 6,
                  "Value #G": 7,
                  "Value #H": 8,
                  "Value #I": 9,
                  "Value #J": 10
                },
                "renameByName": {
                  "nodename": "Node",
                  "Value #A": "Ready",
                  "Value #B": "Uptime",
                  "Value #C": "CPU temp",
                  "Value #D": "CPU",
                  "Value #E": "Load / core",
                  "Value #F": "Memory",
                  "Value #G": "Root disk",
                  "Value #H": "Fan",
                  "Value #I": "Undervoltage",
                  "Value #J": "OOM kills"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "Node"
                  }
                ]
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "center",
                "cellOptions": {
                  "type": "auto"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Node"
                },
                "properties": [
                  {
                    "id": "custom.align",
                    "value": "left"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Ready"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "1": {
                            "text": "Ready",
                            "color": "green"
                          },
                          "0": {
                            "text": "NotReady",
                            "color": "red"
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Uptime"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "CPU temp"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "celsius"
                  },
                  {
                    "id": "decimals",
                    "value": 1
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "yellow",
                          "value": 70
                        },
                        {
                          "color": "orange",
                          "value": 80
                        },
                        {
                          "color": "red",
                          "value": 85
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "CPU"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percentunit"
                  },
                  {
                    "id": "min",
                    "value": 0
                  },
                  {
                    "id": "max",
                    "value": 1
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "gauge",
                      "mode": "basic"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "yellow",
                          "value": 0.7
                        },
                        {
                          "color": "red",
                          "value": 0.9
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Load / core"
                },
                "properties": [
                  {
                    "id": "decimals",
                    "value": 2
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
