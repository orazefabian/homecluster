# Lightweight configuration for kube-prometheus-stack
# Focused on minimal resource usage while maintaining essential monitoring capabilities

kube-prometheus-stack:
  # Prometheus configuration
  prometheus:
    prometheusSpec:
      # Keep off halo-0: it has no Longhorn disk (every TSDB write would go
      # over the network via its instance-manager), it is the control-plane
      # node, and it has no fan (idles ~84 °C). halo-1/halo-2 each hold a
      # replica, so I/O stays local. Same pattern as Immich/Paperless.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - halo-1
                      - halo-2

      # Resource limits for lightweight operation
      resources:
        requests:
          cpu: 100m
          memory: 712Mi
        limits:
          cpu: 500m
          memory: 1556Mi

      # Persistent storage using Longhorn
      # Not backed up: 15 days of metrics are regenerable, and the TSDB's
      # constant block churn made it the largest item in every backup run.
      # The "trim" group (weekly filesystem-trim, see
      # infrastructure/longhorn/manifests/recurring-jobs.yaml) also keeps
      # Longhorn from adding the volume to the "default" backup group.
      # NOTE: labels only apply when the PVC is created - an existing PVC (and
      # its Longhorn volume) must be relabeled by hand.
      storageSpec:
        volumeClaimTemplate:
          metadata:
            labels:
              recurring-job-group.longhorn.io/trim: "enabled"
          spec:
            storageClassName: longhorn
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 50Gi

      # Data retention settings
      # ~0.38 GiB/day at 60s scrape interval -> 60 days ~ 23 GiB. Keep
      # retentionSize above that, or it cuts history short before 60d.
      retention: 60d
      retentionSize: "30GB"

      # Reduce scrape intervals for lower resource usage
      scrapeInterval: 60s
      evaluationInterval: 60s

      # Disable remote write (not needed for basic monitoring)
      remoteWrite: []

  # Grafana configuration
  grafana:
    enabled: true

    deploymentStrategy:
      type: Recreate

    # Resource limits
    resources:
      requests:
        cpu: 250m
        memory: 428Mi
      limits:
        cpu: 500m
        memory: 756Mi

    # Persistent storage for dashboards and settings
    persistence:
      enabled: true
      type: pvc
      storageClassName: longhorn
      accessModes:
        - ReadWriteOnce
      size: 2Gi
      labels:
        recurring-job-group.longhorn.io/default: "enabled"
        recurring-job.longhorn.io/random-volumes: "enabled"
        recurring-job.longhorn.io/s3-monthly-backup: "enabled"

    # Admin login comes from Vaultwarden (item monitoring/monitoring-grafana-admin)
    # via ESO: manifests/grafana-admin.externalsecret.yaml -> Secret
    # monitoring-grafana-admin (keys admin-user / admin-password). Without this
    # the chart generated a Secret with its default password "prom-operator".
    # Grafana stores the password in its DB on the PVC, so a change in
    # Vaultwarden also needs a one-time `grafana cli admin reset-admin-password`
    # (command in the ExternalSecret's header).
    admin:
      existingSecret: monitoring-grafana-admin

    # Default dashboards
    defaultDashboardsEnabled: true
    defaultDashboardsTimezone: UTC

  # ---------------------------------------------------------------- alerting
  # Goal: only actionable alerts reach Discord. Default rules that are always
  # true or flappy on a 4-node Pi cluster are disabled; homelab-specific rules
  # (disks, Longhorn, backups, certs, ...) live in
  # manifests/prometheusrule-homelab.yaml. Measured before enabling (30d):
  # only TargetDown (node flaps), one CrashLooping, NodeSystemSaturation and
  # one ReplicasMismatch fired at warning+.
  defaultRules:
    rules:
      # KubeAPIErrorBudgetBurn (SLO burn-rate math, noise on k3s) is the only
      # alert in this group. Disabling it via `disabled:` renders the group
      # with `rules: null`, which the PrometheusRule CRD rejects - so turn
      # off the whole group instead.
      kubeApiserverSlos: false
    disabled:
      KubeCPUOvercommit: true        # always true when one node is gone
      KubeMemoryOvercommit: true
      NodeSystemSaturation: true     # Pi load averages
      # Replaced by PVCUsageHigh (plain thresholds); predict_linear flaps on
      # the Prometheus TSDB's compaction sawtooth.
      KubePersistentVolumeFillingUp: true

  customRules:
    # The 4 firings in 30d were all short node flaps. A dead node is reported
    # by HomelabNodeDown (and inhibits this one).
    TargetDown:
      for: 30m

  # AlertManager configuration
  alertmanager:
    enabled: true

    # Routing, receivers and inhibit rules live in the AlertmanagerConfig CR
    # manifests/alertmanager-config.yaml (operator-native: it inlines the
    # Discord/healthchecks URLs from the ESO Secret alertmanager-notifications).
    # Not in alertmanager.config here because Alertmanager 0.27 (this chart)
    # rejects discord webhook_url_file, and the URL must stay out of git.
    # With alertmanagerConfiguration set, the operator ignores the chart's
    # config Secret entirely.

    alertmanagerSpec:
      # Keep off halo-0: it has no Longhorn disk (writes would go over
      # the network via its instance-manager), it is the control-plane
      # node, and it has no fan (idles ~84 °C). halo-1/halo-2 each hold a
      # replica, so I/O stays local. Same pattern as Immich/Paperless.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - halo-1
                      - halo-2

      alertmanagerConfiguration:
        name: homelab
        templates:
          - configMap:
              name: alertmanager-templates
              key: homelab.tmpl
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

      # Persistent storage
      # Not backed up either (silences/notification state only); see the
      # Prometheus storageSpec above.
      storage:
        volumeClaimTemplate:
          metadata:
            labels:
              recurring-job-group.longhorn.io/trim: "enabled"
          spec:
            storageClassName: longhorn
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 2Gi

  # Prometheus Node Exporter - collects hardware and OS metrics
  prometheus-node-exporter:
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

  # Kube State Metrics - generates metrics about Kubernetes objects
  kube-state-metrics:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  # Prometheus Operator
  prometheusOperator:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

    # Disable admission webhook patch jobs to prevent ArgoCD sync issues
    # The webhooks work fine without the patch jobs when using ServerSideApply
    admissionWebhooks:
      patch:
        enabled: false

  # Disable components not needed for lightweight setup
  kubeApiServer:
    enabled: true
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeDns:
    enabled: false
