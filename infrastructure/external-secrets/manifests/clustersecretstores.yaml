# Read Vaultwarden items through the bw serve bridge (bitwarden-cli.yaml).
# remoteRef.key is always the Vaultwarden item ID (UUID).
#
#   bitwarden-fields  remoteRef.property = custom field name   <- default
#   bitwarden-login   remoteRef.property = username | password | totp
#   bitwarden-notes   the item's notes (multi-line values, e.g. config files)
#
# Convention: one item per k8s Secret, named "<namespace>/<secret>", in the
# `homecluster` collection, with one hidden custom field per Secret key.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden-fields
  annotations:
    # CRDs come from external-secrets-helm; on a fresh cluster they may not
    # exist yet when this app first syncs.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    webhook:
      url: "http://bitwarden-cli.external-secrets.svc.cluster.local:8087/object/item/{{ .remoteRef.key }}"
      headers:
        Content-Type: application/json
      result:
        jsonPath: '$.data.fields[?@.name=="{{ .remoteRef.property }}"].value'
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden-login
  annotations:
    # CRDs come from external-secrets-helm; on a fresh cluster they may not
    # exist yet when this app first syncs.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    webhook:
      url: "http://bitwarden-cli.external-secrets.svc.cluster.local:8087/object/item/{{ .remoteRef.key }}"
      headers:
        Content-Type: application/json
      result:
        jsonPath: "$.data.login.{{ .remoteRef.property }}"
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden-notes
  annotations:
    # CRDs come from external-secrets-helm; on a fresh cluster they may not
    # exist yet when this app first syncs.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    webhook:
      url: "http://bitwarden-cli.external-secrets.svc.cluster.local:8087/object/item/{{ .remoteRef.key }}"
      headers:
        Content-Type: application/json
      result:
        jsonPath: "$.data.notes"
