# Login for oauth2-proxy's username/password form. Same Vaultwarden item the
# Longhorn UI basic auth used: "longhorn-system/longhorn-ui-auth" (collection
# homecluster), hidden field `auth` = htpasswd line(s) from `htpasswd -nB admin`.
# oauth2-proxy accepts bcrypt and SHA1 entries only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-htpasswd
  namespace: oauth2-proxy
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: oauth2-proxy-htpasswd
    # Creates the Secret if missing, never deletes it, keeps keys it does not manage.
    creationPolicy: CreateOrMerge
    # Set explicitly so ESO does not copy ArgoCD's tracking label onto the
    # Secret (ArgoCD would then prune it).
    template:
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: auth
      remoteRef:
        key: 983e6b65-96ff-49b0-b54a-17ece36a48f5
        property: auth
---
# Key that encrypts the session cookie. Generated once in-cluster and
# deliberately not in Vaultwarden: losing it only means logging in again.
# 32 ASCII characters = 32 bytes, as oauth2-proxy requires (16, 24 or 32).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: oauth2-proxy-cookie-secret
  namespace: oauth2-proxy
spec:
  length: 32
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-cookie-secret
  namespace: oauth2-proxy
spec:
  # Generate once, never rotate (rotating would log everyone out).
  refreshPolicy: CreatedOnce
  target:
    name: oauth2-proxy-cookie-secret
    creationPolicy: CreateOrMerge
    template:
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: oauth2-proxy-cookie-secret
