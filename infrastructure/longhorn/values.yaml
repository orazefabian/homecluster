# Values for the upstream longhorn subchart.
#
# NOTE: these must stay nested under `longhorn:` — the key has to match the
# dependency name in Chart.yaml, otherwise Helm passes them to the (empty)
# parent chart and they are silently ignored.
longhorn:
  persistence:
    # Retain, not the chart's default Delete: pruning or accidentally removing
    # a PVC must not destroy the Longhorn volume behind it. Released volumes
    # then have to be cleaned up by hand (delete the PV *and* the
    # volumes.longhorn.io object — Retain skips the CSI delete).
    reclaimPolicy: Retain
    defaultClassReplicaCount: 2
  defaultSettings:
    defaultReplicaCount: 2
    # S3 (Hetzner) transfers are latency-bound, not bandwidth-bound: each
    # worker moves one 2 MiB block at a time and manages only ~15 Mbit/s.
    # With 1 worker the monthly S3 run crawled at 12-15 Mbit/s on a
    # 100 Mbit/s uplink.
    # Backup runs on ONE replica -> 4 workers ~= 60 Mbit/s, leaving uplink
    # headroom and staying gentle on Hetzner's rate limiting (SlowDown).
    backupConcurrentLimit: 4
    # Restore runs on EVERY replica in parallel (v1 engine), each pulling
    # the full backup from S3 with its own workers: 2 replicas x 6 = 12
    # streams ~= 180 Mbit/s of the 300 Mbit/s downlink.
    restoreConcurrentLimit: 6
  metrics:
    serviceMonitor:
      enabled: true
      additionalLabels:
        # kube-prometheus-stack only picks up ServiceMonitors carrying its
        # release label (serviceMonitorSelector on the Prometheus CR).
        release: monitoring-helm
      metricRelabelings:
        # Controller internals (REST client + workqueue) are ~80% of the
        # series each longhorn-manager exposes and say nothing about volume
        # performance. Keeps volume/replica/engine/node/disk/backup metrics.
        - sourceLabels: [__name__]
          regex: longhorn_(rest_client|workqueue)_.*
          action: drop
