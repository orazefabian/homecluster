# Source of truth: Vaultwarden item "longhorn-system/hetzner-s3-credentials" (collection homecluster).
# Edit values there; ESO syncs them within refreshInterval.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hetzner-s3-credentials
  namespace: longhorn-system
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: hetzner-s3-credentials
    # Creates the Secret if missing, never deletes it, keeps keys it does not manage.
    creationPolicy: CreateOrMerge
    # Set explicitly so ESO does not copy this ExternalSecret's labels onto the
    # Secret: it would inherit ArgoCD's app.kubernetes.io/instance tracking
    # label, and ArgoCD (prune on) would then delete the Secret on next sync.
    template:
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: "AWS_ACCESS_KEY_ID"
      remoteRef:
        key: cad7a50d-a541-404b-857b-adf30993b287
        property: "AWS_ACCESS_KEY_ID"
    - secretKey: "AWS_ENDPOINTS"
      remoteRef:
        key: cad7a50d-a541-404b-857b-adf30993b287
        property: "AWS_ENDPOINTS"
    - secretKey: "AWS_SECRET_ACCESS_KEY"
      remoteRef:
        key: cad7a50d-a541-404b-857b-adf30993b287
        property: "AWS_SECRET_ACCESS_KEY"
