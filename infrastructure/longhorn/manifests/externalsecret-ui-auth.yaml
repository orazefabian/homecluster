# Source of truth: Vaultwarden item "longhorn-system/longhorn-ui-auth"
# (collection homecluster), hidden field `auth` = htpasswd line(s), e.g. from
# `htpasswd -nB admin`. Used by the basic-auth annotations in ingress.yml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-ui-auth
  namespace: longhorn-system
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: longhorn-ui-auth
    # Creates the Secret if missing, never deletes it, keeps keys it does not manage.
    creationPolicy: CreateOrMerge
    # Set explicitly so ESO does not copy ArgoCD's tracking label onto the
    # Secret (ArgoCD would then prune it).
    template:
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: auth
      remoteRef:
        key: 983e6b65-96ff-49b0-b54a-17ece36a48f5
        property: auth
