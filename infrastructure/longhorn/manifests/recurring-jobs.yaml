apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: main-backup
  namespace: longhorn-system
spec:
  name: main-backup
  cron: "0 1 ? * SAT"
  task: backup
  groups:
    - main
  retain: 2
  concurrency: 1
  labels: {}
  parameters: {}
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: random-volumes
  namespace: longhorn-system
spec:
  name: random-volumes
  cron: "0 1 ? * TUE"
  task: backup
  groups:
    - default
  retain: 2
  concurrency: 1
  labels: {}
  parameters: {}
---
# Volumes that are NOT backed up (Prometheus TSDB, Alertmanager: regenerable).
# Two jobs in one: a volume without any recurring-job label is silently put
# into the "default" group (= weekly backups), so these volumes need a job;
# and Prometheus rewrites/deletes its blocks constantly, which Longhorn only
# reclaims through a filesystem trim (actual size grew to ~2x the volume).
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: metrics-trim
  namespace: longhorn-system
spec:
  name: metrics-trim
  cron: "0 3 * * SUN"
  task: filesystem-trim
  groups:
    - trim
  retain: 0
  concurrency: 1
  labels: {}
  parameters: {}
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: s3-monthly-backup
  namespace: longhorn-system
spec:
  name: s3-monthly-backup
  cron: "0 2 1 * *"
  task: backup
  groups:
    - main
  retain: 2
  concurrency: 1
  labels: {}
  parameters: {}
