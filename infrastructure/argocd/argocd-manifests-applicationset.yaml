apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: manifests-applicationset
  namespace: argocd
spec:
  # Without this the ApplicationSet controller stamps
  # resources-finalizer.argocd.argoproj.io onto every generated Application,
  # so removing an entry from the list below cascade-deletes that app's live
  # resources — including CRDs, and with them any CRs of those types. Pruning
  # (below) is scoped to individual resources leaving a manifest; deleting a
  # whole app should not take its data with it. This cannot be worked around
  # by patching the finalizer off an Application, since the controller
  # immediately re-adds it. With this set, removing an entry deletes only the
  # Application object and orphans the resources, which is the intended
  # behaviour here.
  syncPolicy:
    preserveResourcesOnDeletion: true
  # NOTE: no ignoreApplicationDifferences for /spec/syncPolicy. It used to be
  # here, which froze each Application's live syncPolicy and made the template
  # below purely decorative — apps ran with `automated: {}` while this file
  # claimed selfHeal was on. Sync behaviour is declared here and nowhere else;
  # editing it in the UI will now be reverted.
  generators:
    - list:
        elements:
          - name: speedtest
            path: ./apps/speedtest
            namespace: halo
          - name: paperless
            path: ./apps/paperless
            namespace: halo
          - name: pihole-app
            path: ./apps/pihole/manifests
            namespace: halo
          - name: ddclient-app
            path: ./apps/ddclient/manifests
            namespace: halo
          - name: uptime-kuma-app
            path: ./apps/uptime-kuma/manifests
            namespace: halo
          - name: bitwarden-app
            path: ./apps/bitwarden/manifests
            namespace: halo
          - name: samba-app
            path: ./apps/samba-share/manifests
            namespace: halo
          - name: wireguard-app
            path: ./apps/wireguard/manifests
            namespace: halo
          - name: homeassistant-app
            path: ./apps/homeassistant/manifests
            namespace: halo
          - name: headscale
            path: ./apps/headscale
            namespace: halo
          - name: n8n-app
            path: ./apps/n8n
            namespace: halo
          - name: immich-app
            path: ./apps/immich
            namespace: halo
          - name: secrets-backup
            path: ./infrastructure/secrets-backup/manifests
            namespace: secrets-backup
          - name: reloader
            path: ./infrastructure/reloader/manifests
            namespace: reloader
          - name: kite
            path: ./infrastructure/kite/manifests
            namespace: kube-system

  template:
    metadata:
      name: '{{name}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/orazefabian/homecluster-helm
        targetRevision: HEAD
        path: '{{path}}'
        directory:
          recurse: true
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        automated:
          # selfHeal off on purpose: this is a single-operator home cluster and
          # scaling something to 0 or tweaking it by hand for a while is a
          # legitimate workflow. The tweak survives until the next push to HEAD
          # (any commit, Renovate's included), which re-syncs and reverts it.
          selfHeal: false
          # Resources removed from a manifest are deleted on the next sync.
          # Safe for volumes: the longhorn StorageClass is reclaimPolicy=Retain,
          # so a pruned PVC leaves its data behind as a Released PV. Secrets are
          # created out-of-band and untracked, so prune never touches them.
          prune: true
