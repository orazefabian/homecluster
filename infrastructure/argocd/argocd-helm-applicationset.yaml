apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: helm-applicationset
  namespace: argocd
spec:
  # See the matching comment in argocd-manifests-applicationset.yaml. This one
  # matters more: the charts here own CRDs (Longhorn, cert-manager,
  # kube-prometheus-stack), so a cascade delete would take the CRs with them —
  # volumes, issuers, address pools.
  syncPolicy:
    preserveResourcesOnDeletion: true
  # NOTE: no ignoreApplicationDifferences for /spec/syncPolicy — see the matching
  # note in argocd-manifests-applicationset.yaml. Sync behaviour is declared in
  # the template below and nowhere else.
  generators:
    - list:
        elements:
          - name: cert-manager-helm
            chartPath: ./infrastructure/cert-manager
            namespace: cert-manager
            valuesFile: values.yaml
          - name: ingress-nginx-helm
            chartPath: ./infrastructure/ingress-nginx
            namespace: ingress-nginx
            valuesFile: values.yaml
          - name: longhorn-helm
            chartPath: ./infrastructure/longhorn
            namespace: longhorn-system
            valuesFile: values.yaml
          - name: metallb-helm
            chartPath: ./infrastructure/metallb
            namespace: metallb-system
            valuesFile: values.yaml
          - name: monitoring-helm
            chartPath: ./infrastructure/monitoring
            namespace: monitoring
            valuesFile: values.yaml

  template:
    metadata:
      name: '{{name}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/orazefabian/homecluster-helm
        targetRevision: HEAD
        path: '{{chartPath}}'
        helm:
          valueFiles:
            - '{{valuesFile}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          # Prune here is gated on manual approval, unlike the manifests
          # ApplicationSet. These charts own CRDs: if an upgrade renames or
          # drops one, an unattended prune would delete the CRD and every CR of
          # that type with it — volumes.longhorn.io, Certificates,
          # IPAddressPools, ServiceMonitors. Deletions park until approved in
          # the UI/CLI, or via the argocd.argoproj.io/deletion-approved
          # annotation on the Application. Everything else syncs normally.
          - Prune=confirm
        automated:
          # selfHeal off to match the manifests ApplicationSet.
          selfHeal: false
          prune: true
