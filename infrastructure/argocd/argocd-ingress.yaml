apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd
  namespace: argocd
  annotations:
    # If you encounter a redirect loop or are getting a 307 response code
    # then you need to force the nginx ingress to connect to the backend using HTTPS.
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: nginx
  # Reachable as both argocd.halo.fabseit.net and argocd.fabseit.net. The
  # anchor keeps a single backend definition for the two hosts.
  rules:
    - host: argocd.halo.fabseit.net
      http: &http
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  name: https
    - host: argocd.fabseit.net
      http: *http
  tls:
    - hosts:
        - argocd.halo.fabseit.net
        - argocd.fabseit.net
      secretName: local-fabseit-net-argocd-prod-tls
