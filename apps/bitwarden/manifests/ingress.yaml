apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bitwarden
  namespace: halo
spec:
  ingressClassName: nginx
  # Reachable as both bitwarden.halo.fabseit.net and bitwarden.fabseit.net. The
  # anchor keeps a single backend definition for the two hosts.
  rules:
    - host: bitwarden.halo.fabseit.net
      http: &http
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bitwarden
                port:
                  number: 80
    - host: bitwarden.fabseit.net
      http: *http
  tls:
    - hosts:
        - bitwarden.halo.fabseit.net
        - bitwarden.fabseit.net
      secretName: local-fabseit-net-prod-tls
