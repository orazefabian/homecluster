apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperless-ingress
  namespace: halo
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  ingressClassName: nginx
  # Reachable as both paperless.halo.fabseit.net and paperless.fabseit.net. The
  # anchor keeps a single backend definition for the two hosts.
  rules:
    - host: paperless.halo.fabseit.net
      http: &http
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paperless-service
                port:
                  number: 8000
    - host: paperless.fabseit.net
      http: *http
  tls:
    - hosts:
        - paperless.halo.fabseit.net
        - paperless.fabseit.net
      secretName: local-fabseit-net-prod-tls
