apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: halo
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paperless
  template:
    metadata:
      labels:
        app: paperless
    spec:
      containers:
      - name: paperless
        image: ghcr.io/paperless-ngx/paperless-ngx:2.20.15
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "1000Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1300m"
        env:
        # Database: SQLite, stored on paperless-pvc at
        # /usr/src/paperless/data/db.sqlite3 and covered by the PVC backups.
        # Deliberate for this single-user instance — see issue #91. Paperless
        # switches to Postgres as soon as PAPERLESS_DBHOST is set (note: no
        # underscore after DB), so do not add that variable back by accident.
        - name: PAPERLESS_DBENGINE
          value: "sqlite"

        # Redis Configuration
        - name: PAPERLESS_REDIS
          value: "redis://redis-service:6379"
        
        # Core Paperless Configuration
        - name: PAPERLESS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: paperless-secret
              key: PAPERLESS_SECRET_KEY
        - name: PAPERLESS_URL
          valueFrom:
            secretKeyRef:
              name: paperless-secret
              key: PAPERLESS_URL
        
        # Storage Configuration
        volumeMounts:
        - name: paperless-storage
          mountPath: /usr/src/paperless/data
          subPath: data
        - name: paperless-storage
          mountPath: /usr/src/paperless/media
          subPath: media
      volumes:
      - name: paperless-storage
        persistentVolumeClaim:
          claimName: paperless-pvc
