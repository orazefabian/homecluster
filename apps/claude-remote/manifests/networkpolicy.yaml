# Session pods only dial out (claude.ai, GitHub, npm/PyPI, API server); nothing
# connects to them. Longhorn's API is closed separately in
# infrastructure/longhorn/manifests/networkpolicy-api.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-ingress
  namespace: claude-sessions
spec:
  podSelector: {}
  policyTypes:
    - Ingress
