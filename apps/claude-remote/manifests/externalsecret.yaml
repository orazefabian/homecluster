# Source of truth: Vaultwarden item "halo/claude-remote" (collection homecluster),
# hidden field GH_TOKEN = fine-grained PAT for orazefabian/homecluster only
# (Contents: read/write, Pull requests: read/write). main is protected, so the
# most this token can do is push branches and open PRs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-remote
  namespace: halo
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: claude-remote
    # Creates the Secret if missing, never deletes it, keeps keys it does not manage.
    creationPolicy: CreateOrMerge
    # Set explicitly so ESO does not copy ArgoCD's tracking label onto the
    # Secret (ArgoCD would then prune it).
    template:
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: GH_TOKEN
      remoteRef:
        key: VAULTWARDEN_ITEM_ID # TODO: replace with the item ID of halo/claude-remote
        property: GH_TOKEN
