# Source of truth: Vaultwarden item "claude-sessions/claude-session" (collection
# homecluster) with hidden fields APP_ID, INSTALLATION_ID and PRIVATE_KEY_B64
# (`base64 -w0` of the app's .pem). The GitHub App is installed only on the repos
# offered in the launcher, with Contents + Pull requests write (no Workflows,
# no Administration). main's ruleset needs 1 approval and only lets repo admins
# bypass, so sessions open PRs but can never push to or merge into main.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-session
  namespace: claude-sessions
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: claude-session
    # Creates the Secret if missing, never deletes it, keeps keys it does not manage.
    creationPolicy: CreateOrMerge
    # Set explicitly so ESO does not copy ArgoCD's tracking label onto the
    # Secret (ArgoCD would then prune it).
    template:
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: APP_ID
      remoteRef:
        key: e19ee54f-72d7-4109-8284-5842f463c519
        property: APP_ID
    - secretKey: INSTALLATION_ID
      remoteRef:
        key: e19ee54f-72d7-4109-8284-5842f463c519
        property: INSTALLATION_ID
    - secretKey: PRIVATE_KEY_B64
      remoteRef:
        key: e19ee54f-72d7-4109-8284-5842f463c519
        property: PRIVATE_KEY_B64
