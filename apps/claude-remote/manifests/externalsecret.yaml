# Source of truth: Vaultwarden item "claude-sessions/claude-session" (collection
# homecluster), hidden field GH_TOKEN = classic PAT (scope `repo`) of the bot
# account halo-claude-bot. The bot is a Write collaborator on each repo offered
# in the launcher, and main's ruleset requires an approved PR with no bypass
# for it: both session modes can push branches and open PRs, never touch main.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-session
  namespace: claude-sessions
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: claude-session
    # Creates the Secret if missing, never deletes it, keeps keys it does not manage.
    creationPolicy: CreateOrMerge
    # Set explicitly so ESO does not copy ArgoCD's tracking label onto the
    # Secret (ArgoCD would then prune it).
    template:
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: GH_TOKEN
      remoteRef:
        key: VAULTWARDEN_ITEM_ID # TODO: item ID of claude-sessions/claude-session
        property: GH_TOKEN
