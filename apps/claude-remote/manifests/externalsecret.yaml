# Source of truth: Vaultwarden item "claude-sessions/claude-session" (collection
# homecluster), hidden field GH_TOKEN = fine-grained PAT (owner: you), only the
# repos offered in the launcher, Contents + Pull requests read/write, nothing
# else (no Administration, so it cannot change rulesets). Each repo's main has
# a ruleset "require PR" with no bypass actors: sessions can push branches and
# open PRs but never push to main. They CAN merge their own PRs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-session
  namespace: claude-sessions
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: claude-session
    # Creates the Secret if missing, never deletes it, keeps keys it does not manage.
    creationPolicy: CreateOrMerge
    # Set explicitly so ESO does not copy ArgoCD's tracking label onto the
    # Secret (ArgoCD would then prune it).
    template:
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: GH_TOKEN
      remoteRef:
        key: VAULTWARDEN_ITEM_ID # TODO: item ID of claude-sessions/claude-session
        property: GH_TOKEN
