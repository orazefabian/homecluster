# $HOME of every session pod: Claude Code binary, ~/.claude (OAuth login; the
# refresh token rotates, so it needs writable storage rather than a Secret)
# and ~/.claude.json. RWO also enforces one session at a time. 5 Gi: the
# native binary is ~250 MB and the installer keeps a staging copy plus old
# versions (1 Gi filled up on the first install). Not backed up:
# losing it only means logging in again.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claude-auth
  namespace: claude-sessions
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
