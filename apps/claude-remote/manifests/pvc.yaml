# $HOME of every session pod: Claude Code binary, ~/.claude (OAuth login; the
# refresh token rotates, so it needs writable storage rather than a Secret)
# and ~/.claude.json. RWO also enforces one session at a time. Not backed up:
# losing it only means logging in again.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claude-auth
  namespace: claude-sessions
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn
