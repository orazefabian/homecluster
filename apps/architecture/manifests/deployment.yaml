apiVersion: apps/v1
kind: Deployment
metadata:
  name: architecture
  namespace: halo
spec:
  replicas: 1
  # No PVC, so RollingUpdate is safe here (unlike the Longhorn-backed apps).
  selector:
    matchLabels:
      app: architecture
  template:
    metadata:
      labels:
        app: architecture
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        # Projected volume merges all page ConfigMaps into one web root.
        - name: site
          projected:
            sources:
              - configMap:
                  name: architecture-index
              - configMap:
                  name: architecture-overview
              - configMap:
                  name: architecture-home-media
              - configMap:
                  name: architecture-tools
              - configMap:
                  name: architecture-network
              - configMap:
                  name: architecture-platform
