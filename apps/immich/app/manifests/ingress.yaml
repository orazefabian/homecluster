apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich
  namespace: halo
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  # Reachable as both immich.halo.fabseit.net and immich.fabseit.net. The
  # anchor keeps a single backend definition for the two hosts.
  rules:
    - host: immich.halo.fabseit.net
      http: &http
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: immich-server
                port:
                  number: 2283
    - host: immich.fabseit.net
      http: *http
  tls:
    - hosts:
        - immich.halo.fabseit.net
        - immich.fabseit.net
      secretName: local-fabseit-net-prod-tls
