apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: speedtest
  namespace: halo
spec:
  ingressClassName: nginx
  # Reachable as both speedtest.halo.fabseit.net and speedtest.fabseit.net. The
  # anchor keeps a single backend definition for the two hosts.
  rules:
    - host: speedtest.halo.fabseit.net
      http: &http
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: speedtest
                port:
                  number: 80
    - host: speedtest.fabseit.net
      http: *http
  tls:
    - hosts:
        - speedtest.halo.fabseit.net
        - speedtest.fabseit.net
      secretName: local-fabseit-net-prod-tls
