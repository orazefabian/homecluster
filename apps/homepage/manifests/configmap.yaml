apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: halo
  labels:
    app.kubernetes.io/instance: homepage
data:
  settings.yaml: |
    title: halo cluster
    background:
      image: /images/background.jpg
      blur: xl
      brightness: 55
      saturate: 60
      opacity: 100
    cardBlur: xl
    theme: dark
    color: slate
    headerStyle: boxedWidgets
    hideVersion: true
    layout:
      Infrastructure:
        style: row
        columns: 4
        useEqualHeights: true
      Applications:
        style: row
        columns: 4
        useEqualHeights: true

  custom.css: |
    /*
     * Homepage's default tiles are near-transparent (dark:bg-white/5 = 5%).
     * Over a visible background image the text is unreadable, so give the
     * service cards, bookmark cards and top widget boxes a solid dark
     * (slate-900) backing while keeping the frosted-glass blur.
     *
     * .information-widget-search needs naming on top of .widget-container:
     * the search widget renders via ContainerForm, which (unlike Container)
     * never appends the widget-container class, so it would otherwise keep
     * the default 5% fill and look washed out.
     */
    .service-card,
    .widget-container,
    .information-widget-search,
    .bookmark a {
      background-color: rgba(15, 23, 42, 0.72) !important;
    }

    .service-card:hover,
    .bookmark a:hover {
      background-color: rgba(30, 41, 59, 0.85) !important;
    }

    /* Tone the search input down so it reads as a field on the dark form
     * rather than a bright panel. */
    .information-widget-search input {
      background-color: rgba(255, 255, 255, 0.06) !important;
      border-color: rgba(148, 163, 184, 0.3) !important;
      color: #e2e8f0 !important;
    }

    .information-widget-search input::placeholder {
      color: rgba(226, 232, 240, 0.6) !important;
    }

    /*
     * The section headers sit directly on the (now visible) background image,
     * not on a tile. A text-shadow keeps them legible over bright areas of
     * the photo without having to dim the whole background.
     */
    .service-group-name,
    .bookmark-group-name {
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    }

  kubernetes.yaml: |
    mode: cluster

  docker.yaml: ""

  widgets.yaml: |
    # Note: the kubernetes widget renders CPU + memory bars unconditionally;
    # it only reads showLabel/label, so cpu/memory keys here would be ignored.
    - kubernetes:
        cluster:
          show: true
          showLabel: true
          label: cluster
        nodes:
          show: true
          showLabel: true
    # This reads the node the homepage pod happens to be scheduled on, not the
    # cluster as a whole - the kubernetes widget above covers cluster-wide.
    # disk/cputemp are omitted: they'd report the container's filesystem and
    # need host sensors that aren't exposed to the pod.
    - resources:
        label: system
        cpu: true
        memory: true
        uptime: true
        expanded: true
        refresh: 3000
    - search:
        provider: duckduckgo
        target: _blank
        showSearchSuggestions: true

  # Pod status badges: `app` enables the k8s status UI on the tile, and
  # `podSelector` supplies the actual label selector. podSelector is required
  # here because Homepage otherwise defaults to `app.kubernetes.io/name=<app>`,
  # while these workloads are labelled with a plain `app:` key.
  # Clicking a badge expands live CPU/memory for the pod.
  #
  # Widget credentials: {{HOMEPAGE_VAR_X}} is replaced at read time with the env
  # var of the same name, which the deployment pulls in via envFrom from secret
  # `homepage-secret` (kept out of git, see homecluster-secrets). No credential
  # ever lands in this ConfigMap.
  #
  # Widget URLs use in-cluster Service DNS so the tiles keep working when
  # ingress-nginx or Pi-hole is down, with two exceptions called out inline:
  # Paperless (Django ALLOWED_HOSTS) and ArgoCD (self-signed in-cluster TLS).
  #
  # `fields` is capped at four per widget on purpose: the Infrastructure and
  # Applications rows use useEqualHeights, so the tallest tile sets the height
  # of the whole row.
  #
  # Kite, Longhorn, n8n, Bitwarden and Headplane stay link-only - Homepage has
  # no widget for any of them.
  services.yaml: |
    - Infrastructure:
        - Kite:
            href: https://kite.halo.fabseit.net
            description: Kubernetes dashboard
            icon: kubernetes.png
        - ArgoCD:
            href: https://argocd.halo.fabseit.net
            description: GitOps deployments
            icon: argo-cd.png
            # Via the ingress, not argocd-server.argocd.svc: the in-cluster
            # endpoint serves a self-signed cert that Node rejects.
            widget:
              type: argocd
              url: https://argocd.halo.fabseit.net
              key: "{{HOMEPAGE_VAR_ARGOCD_KEY}}"
              fields: ["apps", "synced", "outOfSync", "degraded"]
        - Longhorn:
            href: https://longhorn.halo.fabseit.net
            description: Storage
            icon: longhorn.png
        - Monitoring:
            href: https://monitoring.halo.fabseit.net
            description: Prometheus + Grafana
            icon: grafana.png
            # version 2 is the API shape for Grafana > 10.4; kube-prometheus-stack
            # 67.11 ships Grafana 11.x. The credentials belong to a dedicated
            # Viewer user, not the chart's admin account.
            widget:
              type: grafana
              version: 2
              url: http://monitoring-helm-grafana.monitoring.svc.cluster.local
              username: "{{HOMEPAGE_VAR_GRAFANA_USERNAME}}"
              password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"
              fields: ["dashboards", "datasources", "totalalerts", "alertstriggered"]
        - Pi-hole:
            href: https://pihole.halo.fabseit.net/admin/login
            description: DNS / ad blocking
            icon: pi-hole.png
            namespace: halo
            app: pihole
            podSelector: app=pihole
            # version 6 is mandatory for the v6 API (image pihole/pihole:2026.07.2);
            # without it Homepage talks to the removed v5 endpoints.
            widget:
              type: pihole
              version: 6
              url: http://pihole.halo.svc.cluster.local
              key: "{{HOMEPAGE_VAR_PIHOLE_KEY}}"
              fields: ["queries", "blocked", "blocked_percent", "gravity"]
        - Uptime Kuma:
            href: https://uptime.halo.fabseit.net
            description: Uptime monitoring
            icon: uptime-kuma.png
            namespace: halo
            app: uptime-kuma
            podSelector: app=uptime-kuma
            # No credential - the widget reads a public status page instead of the
            # API. `slug` must match a status page created in Uptime Kuma
            # (the path segment after /status/), otherwise the tile 404s.
            widget:
              type: uptimekuma
              url: http://uptime-kuma.halo.svc.cluster.local:3001
              slug: halo
              fields: ["up", "down", "uptime"]
        - Speedtest:
            href: https://speedtest.halo.fabseit.net
            description: Network speed test
            icon: speedtest-tracker.png
            namespace: halo
            app: speedtest
            podSelector: app=speedtest
            # Widget version 1 (the default): the deployed image is the
            # henrywhitaker3 variant. version 2 - and its `key` field - only
            # applies to the alexjustesen fork.
            widget:
              type: speedtest
              url: http://speedtest.halo.svc.cluster.local
              bitratePrecision: 1
              fields: ["download", "upload", "ping"]
        - Headplane:
            href: https://headplane.halo.fabseit.net
            description: Headscale web UI
            icon: tailscale.png
            namespace: halo
            app: headplane
            podSelector: app=headplane

    - Applications:
        - Home Assistant:
            href: https://homeassistant.halo.fabseit.net
            description: Home automation
            icon: home-assistant.png
            namespace: halo
            app: homeassistant
            podSelector: app=homeassistant
            widget:
              type: homeassistant
              url: http://homeassistant.halo.svc.cluster.local:8123
              key: "{{HOMEPAGE_VAR_HOMEASSISTANT_KEY}}"
              fields: ["people_home", "lights_on", "switches_on"]
        - Immich:
            href: https://immich.halo.fabseit.net
            description: Photo management
            icon: immich.png
            namespace: halo
            app: immich-server
            podSelector: app=immich-server
            # version 2 is required from Immich v1.118 onward (deployed: v3.1.0).
            # The API key needs the server.statistics permission.
            widget:
              type: immich
              version: 2
              url: http://immich-server.halo.svc.cluster.local:2283
              key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"
              fields: ["users", "photos", "videos", "storage"]
        - Paperless:
            href: https://paperless.halo.fabseit.net
            description: Document management
            icon: paperless-ngx.png
            namespace: halo
            app: paperless
            podSelector: app=paperless
            # In-cluster Service, not the ingress. Going through the public
            # hostname made this tile flap with `queryAaaa ENODATA`: the name has
            # no AAAA record, and Homepage's proxy treats the empty IPv6 answer
            # as fatal instead of falling back to the A record. Verified that
            # paperless-ngx accepts this Host header - its ALLOWED_HOSTS is not
            # restricted to PAPERLESS_URL.
            widget:
              type: paperlessngx
              url: http://paperless-service.halo.svc.cluster.local:8000
              key: "{{HOMEPAGE_VAR_PAPERLESS_KEY}}"
              fields: ["total", "inbox"]
        - n8n:
            href: https://n8n.halo.fabseit.net
            description: Workflow automation
            icon: n8n.png
            namespace: halo
            app: n8n
            podSelector: app=n8n
        - Bitwarden:
            href: https://bitwarden.halo.fabseit.net
            description: Password manager
            icon: bitwarden.png
            namespace: halo
            app: bitwarden
            podSelector: app=bitwarden

  bookmarks.yaml: |
    - Network:
        - FritzBox:
            - href: http://192.168.8.1
              icon: fritzbox.png
