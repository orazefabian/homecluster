apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: halo
spec:
  ingressClassName: nginx
  # Reachable as both dashboard.halo.fabseit.net and dashboard.fabseit.net. The
  # anchor keeps a single backend definition for the two hosts.
  rules:
    - host: dashboard.halo.fabseit.net
      http: &http
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 80
    - host: dashboard.fabseit.net
      http: *http
  tls:
    - hosts:
        - dashboard.halo.fabseit.net
        - dashboard.fabseit.net
      secretName: local-fabseit-net-prod-tls
