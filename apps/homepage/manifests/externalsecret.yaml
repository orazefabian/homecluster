# Source of truth: Vaultwarden item "halo/homepage-secret" (collection homecluster).
# Edit values there; ESO syncs them within refreshInterval.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-secret
  namespace: halo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: homepage-secret
    # Creates the Secret if missing, never deletes it, keeps keys it does not manage.
    creationPolicy: CreateOrMerge
    # Set explicitly so ESO does not copy this ExternalSecret's labels onto the
    # Secret: it would inherit ArgoCD's app.kubernetes.io/instance tracking
    # label, and ArgoCD (prune on) would then delete the Secret on next sync.
    template:
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
          argocd.argoproj.io/compare-options: IgnoreExtraneous
  data:
    - secretKey: "HOMEPAGE_VAR_ARGOCD_KEY"
      remoteRef:
        key: fd2d9a4a-20ca-41ad-aeb3-c3be39a4fdca
        property: "HOMEPAGE_VAR_ARGOCD_KEY"
    - secretKey: "HOMEPAGE_VAR_GRAFANA_PASSWORD"
      remoteRef:
        key: fd2d9a4a-20ca-41ad-aeb3-c3be39a4fdca
        property: "HOMEPAGE_VAR_GRAFANA_PASSWORD"
    - secretKey: "HOMEPAGE_VAR_GRAFANA_USERNAME"
      remoteRef:
        key: fd2d9a4a-20ca-41ad-aeb3-c3be39a4fdca
        property: "HOMEPAGE_VAR_GRAFANA_USERNAME"
    - secretKey: "HOMEPAGE_VAR_HOMEASSISTANT_KEY"
      remoteRef:
        key: fd2d9a4a-20ca-41ad-aeb3-c3be39a4fdca
        property: "HOMEPAGE_VAR_HOMEASSISTANT_KEY"
    - secretKey: "HOMEPAGE_VAR_IMMICH_KEY"
      remoteRef:
        key: fd2d9a4a-20ca-41ad-aeb3-c3be39a4fdca
        property: "HOMEPAGE_VAR_IMMICH_KEY"
    - secretKey: "HOMEPAGE_VAR_PAPERLESS_KEY"
      remoteRef:
        key: fd2d9a4a-20ca-41ad-aeb3-c3be39a4fdca
        property: "HOMEPAGE_VAR_PAPERLESS_KEY"
    - secretKey: "HOMEPAGE_VAR_PIHOLE_KEY"
      remoteRef:
        key: fd2d9a4a-20ca-41ad-aeb3-c3be39a4fdca
        property: "HOMEPAGE_VAR_PIHOLE_KEY"
