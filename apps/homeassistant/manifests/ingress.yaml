apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homeassistant
  namespace: halo
spec:
  ingressClassName: nginx
  # Reachable as both homeassistant.halo.fabseit.net and homeassistant.fabseit.net. The
  # anchor keeps a single backend definition for the two hosts.
  rules:
    - host: homeassistant.halo.fabseit.net
      http: &http
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homeassistant
                port:
                  number: 8123
    - host: homeassistant.fabseit.net
      http: *http
  tls:
    - hosts:
        - homeassistant.halo.fabseit.net
        - homeassistant.fabseit.net
      secretName: local-fabseit-net-prod-tls
