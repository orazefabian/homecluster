apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pihole
  namespace: halo
spec:
  ingressClassName: nginx
  # Reachable as both pihole.halo.fabseit.net and pihole.fabseit.net. The
  # anchor keeps a single backend definition for the two hosts.
  rules:
    - host: pihole.halo.fabseit.net
      http: &http
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pihole
                port:
                  number: 80
    - host: pihole.fabseit.net
      http: *http
  tls:
    - hosts:
        - pihole.halo.fabseit.net
        - pihole.fabseit.net
      secretName: local-fabseit-net-prod-tls
