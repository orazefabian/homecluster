apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: halo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: pihole
          image: pihole/pihole:2026.10.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "800m"
              memory: "512Mi"
          ports:
            - containerPort: 53
              protocol: TCP
            - containerPort: 53
              protocol: UDP
            - containerPort: 80
              protocol: TCP
          env:
            - name: TZ
              value: "Europe/Berlin"
            - name: FTLCONF_webserver_api_password
              valueFrom:
                secretKeyRef:
                  name: pihole-secret
                  key: WEBPASSWORD
            - name: FTLCONF_dns_upstreams
              value: "9.9.9.9;1.1.1.1"
            - name: FTLCONF_misc_etc_dnsmasq_d
              value: "true"
            # Local DNS is config-as-code: setting these makes the matching
            # admin-UI pages read-only and overwrites what pihole.toml holds.
            - name: FTLCONF_dns_hosts
              value: "192.168.8.99 nas.home;192.168.8.50 data.home;192.168.8.1 fritz.box;192.168.8.98 raspi.home"
            # Every *.fabseit.net name (incl. *.halo.fabseit.net) goes to the
            # ingress-nginx LB, so new apps need no DNS entry. vpn.fabseit.net
            # is excluded and resolved upstream: Headscale terminates its own
            # TLS and WireGuard is UDP, neither goes through the ingress.
            - name: FTLCONF_misc_dnsmasq_lines
              value: "address=/fabseit.net/192.168.8.30;server=/vpn.fabseit.net/#"
            # Clears the per-app CNAMEs once set via the UI; the wildcard above
            # replaces them.
            - name: FTLCONF_dns_cnameRecords
              value: ""
          volumeMounts:
            - mountPath: /etc/dnsmasq.d
              name: dnsmasq-config-volume
            - mountPath: /etc/pihole
              name: pihole-config-volume
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
      volumes:
        - name: dnsmasq-config-volume
          persistentVolumeClaim:
            claimName: pihole-dnsmasq # Shared PVC for both volumes.
        - name: pihole-config-volume
          persistentVolumeClaim:
            claimName: pihole-config # Shared PVC for both volumes.
