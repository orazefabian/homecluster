# Source of truth: Vaultwarden item "halo/ddclient-conf" (collection homecluster),
# fields CLOUDFLARE_LOGIN / _PASSWORD / _ZONE / _DOMAIN. ESO renders the whole
# ddclient.conf into Secret ddclient-conf; an init container copies it into
# /config at pod start (see deployment.yaml). Edit values in Vaultwarden —
# Reloader restarts ddclient when the rendered Secret changes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ddclient-conf
  namespace: halo
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: ddclient-conf
    # Creates the Secret if missing, never deletes it, keeps keys it does not manage.
    creationPolicy: CreateOrMerge
    template:
      # Set explicitly so ESO does not copy this ExternalSecret's labels onto the
      # Secret: it would inherit ArgoCD's app.kubernetes.io/instance tracking
      # label, and ArgoCD (prune on) would then delete the Secret on next sync.
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
          argocd.argoproj.io/compare-options: IgnoreExtraneous
      engineVersion: v2
      data:
        ddclient.conf: |
          # /etc/ddclient.conf
          #
          daemon=300
          syslog=yes
          protocol=cloudflare
          use=web
          server=api.cloudflare.com/client/v4
          login={{ .CLOUDFLARE_LOGIN }}
          password={{ .CLOUDFLARE_PASSWORD }}
          zone={{ .CLOUDFLARE_ZONE }}
          {{ .CLOUDFLARE_DOMAIN }}
  data:
    - secretKey: CLOUDFLARE_LOGIN
      remoteRef:
        key: 02d4bda2-61fc-43d0-b052-a9a3a508f77e
        property: CLOUDFLARE_LOGIN
    - secretKey: CLOUDFLARE_PASSWORD
      remoteRef:
        key: 02d4bda2-61fc-43d0-b052-a9a3a508f77e
        property: CLOUDFLARE_PASSWORD
    - secretKey: CLOUDFLARE_ZONE
      remoteRef:
        key: 02d4bda2-61fc-43d0-b052-a9a3a508f77e
        property: CLOUDFLARE_ZONE
    - secretKey: CLOUDFLARE_DOMAIN
      remoteRef:
        key: 02d4bda2-61fc-43d0-b052-a9a3a508f77e
        property: CLOUDFLARE_DOMAIN
