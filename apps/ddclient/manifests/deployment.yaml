apiVersion: apps/v1
kind: Deployment
metadata:
  name: ddclient
  namespace: halo # Change the namespace if needed
  annotations:
    # Restart when the ESO-rendered ddclient-conf Secret changes (Vaultwarden edit).
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ddclient
  template:
    metadata:
      labels:
        app: ddclient
    spec:
      # ddclient.conf comes from Vaultwarden: ESO renders it into the Secret
      # ddclient-conf (externalsecret.yaml), and this init container copies it
      # into an emptyDir at /config. It is copied rather than mounted because the
      # image's init runs `lsiown -R /config` and `chmod 600 /config/*`, which
      # fail on a read-only Secret mount. Nothing in /config needs to persist
      # (the cache lives in /run), so the old ddclient-config PVC is unused.
      initContainers:
      - name: config-from-secret
        image: busybox:1.38-musl
        command: ["sh", "-c", "cp /secret/ddclient.conf /config/ddclient.conf"]
        resources:
          requests:
            memory: "8Mi"
            cpu: "10m"
          limits:
            memory: "32Mi"
        volumeMounts:
        - name: config-volume
          mountPath: /config
        - name: ddclient-conf
          mountPath: /secret
          readOnly: true
      containers:
      - name: ddclient
        image: lscr.io/linuxserver/ddclient:latest
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        env:
        - name: PUID
          value: "1000" # Replace with your desired user ID
        - name: PGID
          value: "1000" # Replace with your desired group ID
        - name: TZ
          value: "Europe/London" # Replace with your timezone
        volumeMounts:
        - name: config-volume
          mountPath: /config/
          readOnly: false
      volumes:
      - name: config-volume
        emptyDir: {}
      - name: ddclient-conf
        secret:
          secretName: ddclient-conf
          defaultMode: 0400
