apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uptime-kuma
  namespace: halo
spec:
  ingressClassName: nginx
  # Reachable as both uptime.halo.fabseit.net and uptime.fabseit.net. The
  # anchor keeps a single backend definition for the two hosts.
  rules:
    - host: uptime.halo.fabseit.net
      http: &http
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: uptime-kuma
                port:
                  number: 3001
    - host: uptime.fabseit.net
      http: *http
  tls:
    - hosts:
        - uptime.halo.fabseit.net
        - uptime.fabseit.net
      secretName: local-fabseit-net-prod-tls
