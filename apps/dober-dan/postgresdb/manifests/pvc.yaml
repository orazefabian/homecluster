apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-dober-dan-data
  namespace: halo
  labels:
    # Her whole learning history. Backed up on every schedule there is.
    recurring-job-group.longhorn.io/default: "enabled"
    recurring-job.longhorn.io/main-backup: "enabled"
    recurring-job.longhorn.io/s3-monthly-backup: "enabled"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      # Two people's cards, reviews and lesson progress. Tiny; 5Gi is headroom
      # for years, and the audio lives on its own volume.
      storage: 5Gi
