apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dober-dan-ingress
  namespace: halo
  annotations:
    # Speech recordings. The app caps one at 10 MB; the nginx default of 1 MB
    # would reject them first.
    nginx.ingress.kubernetes.io/proxy-body-size: "12m"
    # Whisper on arm64 takes its time over a phrase.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  # Reachable as both dober-dan.halo.fabseit.net and dober-dan.fabseit.net. The
  # anchor keeps a single backend definition for the two hosts.
  rules:
    - host: dober-dan.halo.fabseit.net
      http: &http
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dober-dan-service
                port:
                  number: 3000
    - host: dober-dan.fabseit.net
      http: *http
  tls:
    - hosts:
        - dober-dan.halo.fabseit.net
        - dober-dan.fabseit.net
      secretName: local-fabseit-net-prod-tls
