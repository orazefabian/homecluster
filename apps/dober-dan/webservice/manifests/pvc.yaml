apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dober-dan-media
  namespace: halo
  labels:
    recurring-job-group.longhorn.io/default: "enabled"
    recurring-job.longhorn.io/main-backup: "enabled"
    recurring-job.longhorn.io/s3-monthly-backup: "enabled"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      # Generated speech, recorded family voices, and every attempt she makes.
      # The recordings of real people are the part that cannot be regenerated,
      # which is why this volume is on the backup schedules.
      storage: 10Gi
