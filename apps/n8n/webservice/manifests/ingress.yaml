apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n
  namespace: halo
spec:
  ingressClassName: nginx
  # Reachable as both n8n.halo.fabseit.net and n8n.fabseit.net. The
  # anchor keeps a single backend definition for the two hosts.
  rules:
    - host: n8n.halo.fabseit.net
      http: &http
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: n8n
                port:
                  number: 5678
    - host: n8n.fabseit.net
      http: *http
  tls:
    - hosts:
        - n8n.halo.fabseit.net
        - n8n.fabseit.net
      secretName: local-fabseit-net-prod-tls
