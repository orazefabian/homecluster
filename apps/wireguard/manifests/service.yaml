apiVersion: v1
kind: Service
metadata:
  labels:
    app: wireguard
  name: wireguard
  namespace: halo
spec:
  allocateLoadBalancerNodePorts: false
  loadBalancerIP: 192.168.8.51
  ports:
    - targetPort: 51820
      port: 51820
      protocol: UDP
  selector:
    app: wireguard
  type: LoadBalancer
  # Only the node running the pod announces the VIP, so tunnel traffic isn't
  # forwarded through whichever node MetalLB happened to pick. Also lets
  # WireGuard see the peers' real endpoints instead of a node IP.
  externalTrafficPolicy: Local
