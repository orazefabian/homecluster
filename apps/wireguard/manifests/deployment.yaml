apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    meta.helm.sh/release-name: wireguard
  labels:
  name: wireguard
  namespace: halo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wireguard
  template:
    metadata:
      annotations:
        container.apparmor.security.beta.kubernetes.io/wireguard: unconfined
      labels:
        app: wireguard
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - halo-8
      containers:
      - env:
        - name: TZ
          value: Europe/Vienna
        # Peers: add or remove a name here (letters/digits only), merge, then
        # `helper/wg-peer.sh show <name>` for the QR code. Removing a name
        # revokes the peer; `helper/wg-peer.sh purge <name>` also deletes its
        # keys so re-adding the name later gets fresh ones.
        - name: PEERS
          value: fabseMobile,benni,volte,damian,christina,dyna,chrissiPc,silvia,fabianPC
        - name: PUID
          value: '1000'
        - name: PGID
          value: '1000'
        - name: ALLOWEDIPS
          value: 0.0.0.0/0
        - name: SERVERPORT
          value: '51820'
        - name: SERVERURL
          value: vpn.fabseit.net
        - name: INTERNAL_SUBNET
          value: 10.13.13.0
        - name: PEERDNS
          value: auto
        # Don't print every peer's QR code (= its private key) into the pod log
        # on each regeneration; helper/wg-peer.sh shows them on demand.
        - name: LOG_CONFS
          value: 'false'
        image: lscr.io/linuxserver/wireguard:1.0.20260223-r0-ls130
        name: wireguard
        ports:
        - containerPort: 51820
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - SYS_MODULE
          privileged: true
          seccompProfile:
            type: Unconfined
        volumeMounts:
        - mountPath: "/config/"
          name: wireguard-config
      initContainers:
      - name: wireguard-init
        image: busybox:1.38-musl
        command:
        - sh
        - -c
        - |
          set -eu
          # One-time: the deprecated arm64v8-alpine image kept the server conf
          # at /config/wg0.conf; the current image uses /config/wg_confs/, and
          # a stale wg_confs/wg0.conf from 2025 is still on this volume. Move
          # both aside so the image renders a fresh wg0.conf from the template
          # (existing peer keys and IPs are reused). No-op once migrated,
          # because the current image never writes /config/wg0.conf.
          if [ -f /config/wg0.conf ]; then
            mkdir -p /config/legacy-layout-backup
            mv /config/wg0.conf /config/legacy-layout-backup/
            if [ -d /config/wg_confs ]; then
              mv /config/wg_confs /config/legacy-layout-backup/
            fi
            echo "moved legacy wg0.conf and wg_confs/ to /config/legacy-layout-backup/"
          fi
          # Every start: server template from git (includes the DNS DNAT rules).
          mkdir -p /config/templates
          cp /template/server.conf /config/templates/server.conf
        resources:
          requests:
            memory: "8Mi"
            cpu: "10m"
          limits:
            memory: "32Mi"
        volumeMounts:
        - mountPath: "/config/"
          name: wireguard-config
        - mountPath: /template
          name: server-template
          readOnly: true
      volumes:
      - name: wireguard-config
        persistentVolumeClaim:
          claimName: wireguard-data
      - name: server-template
        configMap:
          name: wireguard-server-template
