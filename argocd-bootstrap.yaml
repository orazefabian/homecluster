apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-bootstrap
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/orazefabian/homecluster-helm
    targetRevision: HEAD
    path: ./infrastructure/argocd
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      # See argocd-manifests-applicationset.yaml for the selfHeal reasoning.
      selfHeal: false
      # Deliberately NOT pruning here, unlike every other app. This is the root
      # app: its resources are the ApplicationSets and Applications themselves,
      # so a prune would delete an Application object and orphan everything it
      # manages in one step. Removing an app from this repo should be a
      # conscious `kubectl delete app <name>`.
      prune: false
